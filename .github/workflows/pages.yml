# Page files (packages/page-format): typecheck (the library with no Node
# types, so it stays usable in a browser and the phone's WebView; then the
# tests and tools), every test and conformance case, the publishable build,
# and that docs/pages.md is the one the schema generates.
name: pages

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/page-format
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests and conformance fixtures
        run: npm test
      - name: Build
        run: npm run build && node -e "import('./dist/index.js').then((m) => { if (!m.checkPage) process.exit(1); })"
      - name: The docs are current
        run: npm run docs:check
