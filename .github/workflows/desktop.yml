# The desktop app and its protocol client, on Linux. Typecheck and unit
# tests for packages/client and apps/desktop; then the app end to end in a
# headless Electron under xvfb, against a ravenryd built here as the app
# ships it (libghostty-vt with Zig, cached as in code.yml; static): it
# starts the daemon, opens real shells, types, pastes, switches tabs and
# closes one, then answers a real ask, approve and secret in the window
# (the secret is then found nowhere), runs an approve it edited (the edit
# runs, not the proposal) and refuses one with a reason. Every tool there
# refuses a folder of the real user's (tools/test-env.mjs). Then the
# sidebar's pages in the app (tools/pages-test.mjs): an agent's script in a
# real pane makes a page, the app edits it, the script breaks it, a
# project's page is trusted and its run button asks for approval. The hub's
# bundle of packages/page-format must be current. Then the app packaged (unpacked, no installer) and checked:
# it finds its own ravenryd, starts it beside an older one, writes its hub
# service in dry-run mode into a throwaway HOME, and the hub runs as that
# service says. release.yml builds every installer.
name: desktop

# Only when the app or what it ships changes (its client and page format,
# the hub, the daemon), the test guard, the lockfile or this file; not for
# Markdown alone.
on:
  push:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'hub/**'
      - 'daemon/**'
      - 'tools/test-env.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - 'hub/**'
      - 'daemon/**'
      - 'tools/test-env.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
      - '!**/*.md'

permissions:
  contents: read

# A newer push to the same ref cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # The runner's temp folder sits inside its home: the test tools refuse
      # any folder of the real user's (tools/test-env.mjs) unless a test
      # root names it.
      - name: The runner's temp folder is a test root
        run: echo "RAVENRY_TEST_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: Cache libghostty-vt
        id: libghostty
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: daemon/.deps/libghostty-vt-*
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-zig-0.17.1-build-2-${{ hashFiles('daemon/go.sum', 'daemon/scripts/libghostty.sh') }}
      # Zig from its release tarball, pinned by the SHA-256 that
      # ziglang.org/download/index.json lists for 0.17.1 (as in code.yml).
      # mlugg/setup-zig still runs on the deprecated Node 20 (v2.2.1, its
      # latest release, and its main branch as of 2026-11-06), and a pinned
      # checksum needs no action at all. Community mirrors first, as
      # ziglang.org asks of CI; the checksum makes any of them safe.
      - name: Install Zig 0.17.1
        if: steps.libghostty.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          f=zig-x86_64-linux-0.17.1.tar.xz
          sum=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
          for url in https://ziglang.freetls.fastly.net/$f https://pkg.hexops.org/zig/$f https://zigmirror.hryx.net/zig/$f https://ziglang.org/download/0.17.1/$f; do
            if curl -fsSL --retry 2 --max-time 300 -o "$f" "$url" && echo "$sum  $f" | sha256sum -c --quiet; then
              tar -xJf "$f" && echo "$RUNNER_TEMP/${f%.tar.xz}" >> "$GITHUB_PATH" && exit 0
            fi
            echo "no good copy from $url"
          done
          exit 1
      # As the app ships it (static, the app's version), and an older one
      # for the update check below.
      - name: Build ravenryd
        run: |
          command -v pkg-config >/dev/null || sudo apt-get install -y pkg-config
          apps/desktop/scripts/build-ravenryd.sh "$RUNNER_TEMP/rv/ravenryd-linux-x64"
          apps/desktop/scripts/build-ravenryd.sh "$RUNNER_TEMP/old/ravenryd" 0.0.1
          file "$RUNNER_TEMP/rv/ravenryd-linux-x64"
          echo "RAVENRYD=$RUNNER_TEMP/rv/ravenryd-linux-x64" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # The quick checks, in this job (a job of their own took 22 s and was
      # billed a whole minute).
      - name: Typecheck
        run: |
          npm --workspace @ravenry/client run typecheck
          npm --workspace @ravenry/desktop run typecheck
      - name: apps/desktop unit tests
        run: npm --workspace @ravenry/desktop test
      - name: The hub's bundle of the page format is current
        run: node hub/tools/vendor-page-format.mjs --check
      # The hub's remote installer against real sshd in Linux containers:
      # bash, zsh and fish logins that print banners, BusyBox, a full tmpfs,
      # a jump host, with the static build above (hub/tools/remote-install-docker.mjs).
      - name: The remote installer against real sshd (Docker)
        run: RAVENRY_LINUX_BUILDS="$RUNNER_TEMP/rv" node hub/tools/remote-install-docker.mjs
      - name: Electron and what it needs on Linux
        run: |
          node node_modules/electron/install.js
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxtst6
      - name: packages/client against the real daemon
        run: npm --workspace @ravenry/client test
      - name: The app end to end (headless Electron, xvfb)
        run: |
          npm --workspace @ravenry/desktop run build
          xvfb-run -a --server-args="-screen 0 1920x1080x24" node apps/desktop/tools/smoke.mjs "$RUNNER_TEMP/smoke"
      - name: The selection and the front agree, on a click and at launch (headless Electron, xvfb)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node apps/desktop/tools/selection-test.mjs "$RUNNER_TEMP/smoke/selection"
      - name: The terminal's keys arrive as their bytes (headless Electron, xvfb)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node apps/desktop/tools/keys-test.mjs "$RUNNER_TEMP/smoke/keys"
      - name: Only agents' input is marked, beside the cells (headless Electron, xvfb)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node apps/desktop/tools/marks-test.mjs "$RUNNER_TEMP/smoke/marks"
      - name: The terminal's basics (headless Electron, xvfb)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node apps/desktop/tools/basics-test.mjs "$RUNNER_TEMP/smoke/basics"
      - name: The brief, in the panel and as a page (headless Electron, xvfb)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node apps/desktop/tools/brief-test.mjs "$RUNNER_TEMP/smoke/brief"
      - name: The sidebar's pages in the app (headless Electron, xvfb)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node apps/desktop/tools/pages-test.mjs "$RUNNER_TEMP/smoke/pages"
      # The release build (no test hooks, src/main/gate.ts) and its test
      # twin (release-test/, the same with them, for the driven first run).
      - name: The packaged app (unpacked), checked end to end
        run: |
          npm --workspace @ravenry/desktop run pack -- --linux --arch x64 --dir --test-twin --ravenryd "$RUNNER_TEMP/rv"
          xvfb-run -a --server-args="-screen 0 1920x1080x24" node apps/desktop/tools/package-check.mjs apps/desktop/release/linux-unpacked "$RUNNER_TEMP/smoke/package" --old-ravenryd "$RUNNER_TEMP/old/ravenryd"
      # A first run of the packaged app (its test twin, which a script can
      # drive), from launch to a working session, with a stand-in Claude
      # Code: it must take under 30 seconds.
      - name: The packaged app's first run, timed
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node apps/desktop/tools/first-run.mjs apps/desktop/release-test/linux-unpacked "$RUNNER_TEMP/smoke/first-run" --budget 30000
      # The checks stop their daemons with SIGTERM and return; a daemon still
      # removing its pane logs while the folder is zipped fails the upload.
      - name: Let the test daemons exit
        if: always()
        run: |
          for i in $(seq 1 50); do pgrep -f ravenryd >/dev/null || exit 0; sleep 0.2; done
          pkill -KILL -f ravenryd || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: desktop-smoke
          path: ${{ runner.temp }}/smoke
          include-hidden-files: true
          if-no-files-found: ignore
