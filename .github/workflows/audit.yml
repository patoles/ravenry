# The personal-data audit (tools/audit.mjs) on every push and pull request,
# and in the same job the page files' checks (packages/page-format): each
# took under 20 s in a job of its own, billed a whole minute each.
# This repository is public with its whole history, so a commit that
# carries personal data must fail here. The personal term list comes from
# the repository secret AUDIT_TERMS (one term per line) and is never
# committed. Without it the audit fails and says how to add it, except on a
# pull request from a fork: GitHub gives such a run no secrets, so it audits
# the generic shapes only (emails, keys, home paths...) and the full audit
# runs on main once it is merged (run it locally before merging).
name: audit

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check that the AUDIT_TERMS secret is set
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          AUDIT_TERMS: ${{ secrets.AUDIT_TERMS }}
        run: |
          if [ -z "$AUDIT_TERMS" ]; then
            echo "::error title=AUDIT_TERMS secret missing::The repository secret AUDIT_TERMS is not set (or not available to this run, as on a pull request from a fork). Add it under Settings > Secrets and variables > Actions, one personal term per line. The audit refuses to pass without it."
            exit 1
          fi
      - name: Audit every file
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          AUDIT_TERMS: ${{ secrets.AUDIT_TERMS }}
        run: node tools/audit.mjs --require-terms
      - name: Audit every file, generic shapes only (a pull request from a fork has no secrets)
        if: ${{ github.event.pull_request.head.repo.fork }}
        run: node tools/audit.mjs
      # Page files (packages/page-format): typecheck (the library with no
      # Node types, so it stays usable in a browser and the phone's WebView;
      # then the tests and tools), every test and conformance case, the
      # publishable build, and that docs/pages.md is the one the schema
      # generates. A few seconds, so on every push too.
      - name: Page files, npm ci
        working-directory: packages/page-format
        run: npm ci
      - name: Page files, typecheck
        working-directory: packages/page-format
        run: npm run typecheck
      - name: Page files, tests and conformance fixtures
        working-directory: packages/page-format
        run: npm test
      - name: Page files, build
        working-directory: packages/page-format
        run: npm run build && node -e "import('./dist/index.js').then((m) => { if (!m.checkPage) process.exit(1); })"
      - name: Page files, the docs are current
        working-directory: packages/page-format
        run: npm run docs:check
