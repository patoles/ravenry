# The code checks that run on Linux. The hub targets macOS (cmux, iTerm2,
# Rex, osascript), so its suites that drive a terminal or a headless
# browser run on a Mac, not here. Here: go vet and go build for the daemon,
# node --check over every script, and the hub suites that need no macOS
# tool and no browser.
name: code

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then gofmt -l .; echo "gofmt: the files above need gofmt -w"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - run: go build -o "$RUNNER_TEMP/ravenryd" ./cmd/ravenryd && "$RUNNER_TEMP/ravenryd" version

  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: node --check over every script
        working-directory: .
        run: |
          find hub tools -path '*/node_modules' -prune -o -path '*/.tmp' -prune -o \( -name '*.mjs' -o -name '*.js' -o -name '*.cjs' \) -type f -print0 | xargs -0 -n1 node --check
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Hub suites that run on Linux
        run: |
          for t in data-guard-test sessions-test events-hook-test handoff-hook-test plans-test assistant-test rules-repeats-test; do
            echo "::group::$t"
            node "tools/$t.mjs"
            echo "::endgroup::"
          done
