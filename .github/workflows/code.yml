# The code checks that run on Linux. The hub targets macOS (cmux, iTerm2,
# Rex, osascript), so its suites that drive a terminal or a headless
# browser run on a Mac, not here. Here: the daemon (libghostty-vt built with
# Zig, then gofmt, go vet, go build and every Go test), then against that
# build @ravenry/node-client and the hub's Ravenry adapter (its seven
# terminal operations, the agent status channel and hook decisions), remote
# machines through a fake ssh, and the hub's API on a real board, with the
# rule that only a person answers a checkpoint (from inside a real pane,
# the command line, a raw socket call and curl to the hub are refused, and
# so is every hub write that stands for a person's decision, and a plan's
# gate ticked in BRIEF.md from a pane is not taken as passed); an edited
# command runs through the daemon and the hub instead of the proposed one;
# every test that starts ravenryd or the hub refuses a folder of the real
# user's (tools/test-env.mjs, daemon/internal/testenv), and one that would
# drive a real cmux, iTerm2 or Rex; the sidebar's pages as files, with the
# ravenry binary's page check against a real board (hub/tools/pages-test.mjs);
# node --check over every script, and the hub suites that need no macOS
# tool and no browser.
name: code

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: daemon/go.mod
          cache: false
      - name: gofmt
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then echo "$bad"; echo "gofmt: the files above need gofmt -w"; exit 1; fi
      # scripts/libghostty.sh takes the ghostty commit from the go-libghostty
      # version in go.mod, so go.sum keys the cache. The "build" number is
      # bumped by hand to rebuild once on purpose: the Zig install below
      # only runs on a miss, so a bump is how it gets proven in CI (build 2,
      # 2026-11-06: its first run since it replaced setup-zig).
      - name: Cache libghostty-vt
        id: libghostty
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: daemon/.deps/libghostty-vt-*
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-zig-0.17.1-build-2-${{ hashFiles('daemon/go.sum', 'daemon/scripts/libghostty.sh') }}
      # Zig from its release tarball, pinned by the SHA-256 that
      # ziglang.org/download/index.json lists for 0.17.1. mlugg/setup-zig
      # still runs on the deprecated Node 20 (v2.2.1, its latest release,
      # and its main branch as of 2026-11-06), and a pinned checksum needs no
      # action at all. Community mirrors first, as ziglang.org asks of CI;
      # the checksum makes any of them safe.
      - name: Install Zig 0.17.1
        if: steps.libghostty.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          f=zig-x86_64-linux-0.17.1.tar.xz
          sum=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a
          for url in https://ziglang.freetls.fastly.net/$f https://pkg.hexops.org/zig/$f https://zigmirror.hryx.net/zig/$f https://ziglang.org/download/0.17.1/$f; do
            if curl -fsSL --retry 2 --max-time 300 -o "$f" "$url" && echo "$sum  $f" | sha256sum -c --quiet; then
              tar -xJf "$f" && echo "$RUNNER_TEMP/${f%.tar.xz}" >> "$GITHUB_PATH" && exit 0
            fi
            echo "no good copy from $url"
          done
          exit 1
      - name: Build libghostty-vt
        run: |
          command -v pkg-config >/dev/null || sudo apt-get install -y pkg-config
          echo "PKG_CONFIG_PATH=$(scripts/libghostty.sh)" >> "$GITHUB_ENV"
      # zsh and fish for the shell integration tests (bash is there).
      - name: Shells
        run: sudo apt-get install -y --no-install-recommends zsh fish && zsh --version && bash --version | head -1 && fish --version
      - run: go vet ./...
      - run: go build -o "$RUNNER_TEMP/ravenryd" ./cmd/ravenryd && "$RUNNER_TEMP/ravenryd" version
      # pipefail: without it the step takes tee's status, and a failing
      # test would not fail the job.
      - name: go test
        run: |
          set -o pipefail
          go test -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: node-client and the hub's Ravenry adapter against this daemon
        working-directory: .
        env:
          RAVENRYD_BIN: ${{ runner.temp }}/ravenryd
        run: |
          set -o pipefail
          node --test packages/node-client/test/*.test.mjs
          node hub/tools/ravenryd-test.mjs 2>&1 | tee -a "$RUNNER_TEMP/test.log"
          node hub/tools/machines-test.mjs 2>&1 | tee -a "$RUNNER_TEMP/test.log"
          node hub/tools/hub-api-test.mjs 2>&1 | tee -a "$RUNNER_TEMP/test.log"
          node hub/tools/person-routes-test.mjs 2>&1 | tee -a "$RUNNER_TEMP/test.log"
          node hub/tools/pages-test.mjs 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      - name: Measurements
        run: grep '^MEASURE' "$RUNNER_TEMP/test.log" | tee -a "$GITHUB_STEP_SUMMARY"

  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: node --check over every script
        working-directory: .
        run: |
          find hub tools packages/node-client -path '*/node_modules' -prune -o -path '*/.tmp' -prune -o \( -name '*.mjs' -o -name '*.js' -o -name '*.cjs' \) -type f -print0 | xargs -0 -n1 node --check
      # No npm ci: the hub's package says os darwin, and these suites use
      # none of its dev dependencies (Playwright, jsQR).
      - name: Hub suites that run on Linux
        run: |
          for t in data-guard-test sessions-test events-hook-test handoff-hook-test hookinstall-ravenryd-test plans-test assistant-test rules-repeats-test ravenryd-test person-routes-test pages-test; do
            echo "::group::$t"
            node "tools/$t.mjs"
            echo "::endgroup::"
          done
