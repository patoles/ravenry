# The contributor licence agreement check (CLA.md), with
# contributor-assistant/github-action. No GitHub App and no personal token:
# signatures are stored in this repository, in signatures/cla.json on the
# branch cla-signatures, committed by the action with the workflow's own
# token. A branch of its own, so main can stay protected (pull requests
# only) while the action still writes; the branch must exist before the
# first pull request (make it once from main).
#
# pull_request_target runs this file as it is on main, with write access,
# for pull requests from forks too: it never checks out or runs the pull
# request's code, only comments on it and sets its status.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # On the job, not the step: a job whose steps are all skipped still
    # starts a runner for every issue comment.
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: patoles,*[bot]
          signed-commit-message: "Record the CLA signature of $contributorName in pull request #$pullRequestNo"
          create-file-commit-message: "Create the CLA signature file"
