# Ghostty settings for Ravenry's window. The person's own Ghostty config is
# never read, so the window is the same on every Mac. Keys are Ghostty's
# (https://ghostty.org/docs/config/reference).

# The attach command is the window's only process, and it always runs:
# closing the window must not ask about it.
confirm-close-surface = false

# No dialogs in the spike: pasting text with newlines goes through, and a
# program reading the clipboard (OSC 52) is refused.
clipboard-paste-protection = false
clipboard-read = deny

# The pane's shell gets Ravenry's shell integration from the daemon.
shell-integration = none

window-padding-x = 4
window-padding-y = 4
