# XcodeGen spec for the native Mac app (scripts/build.sh generates the
# Xcode project from it; the .xcodeproj is not committed).
name: RavenryMac
options:
  bundleIdPrefix: dev.ravenry
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  RavenryMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/RavenryMac
      # The design tokens every client shares (shared/README.md), read at
      # launch (Design.swift).
      - path: ../../shared/tokens/tokens.json
        buildPhase: resources
      # The words (Strings.swift) and the icons (Icons.swift), shared too.
      - path: ../../shared/strings/en.json
        buildPhase: resources
      - path: ../../shared/icons
        buildPhase: resources
        type: folder
      # The terminal settings' keys and the shipped themes (Settings.swift).
      - path: ../../shared/settings/settings.json
        buildPhase: resources
      - path: ../../shared/themes
        buildPhase: resources
        type: folder
      # Ravenry's glyph font, the phone terminal's (Glyphs.swift).
      - path: ../../apps/phone/src/glyphs.css
        buildPhase: resources
      # The hub's own code for a hub older than state.sidebar (OlderHub.swift).
      - path: ../../hub/server/sidebar.mjs
        buildPhase: resources
      - path: ../../hub/server/cpwords.mjs
        buildPhase: resources
      - path: ../../hub/server/briefnext.mjs
        buildPhase: resources
      - path: ../../hub/server/handoffline.mjs
        buildPhase: resources
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: JavaScriptCore.framework
    settings:
      base:
        PRODUCT_NAME: RavenryMac
        PRODUCT_BUNDLE_IDENTIFIER: dev.ravenry.mac.spike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ravenry Native
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        DEAD_CODE_STRIPPING: YES
    postCompileScripts:
      - name: Bundle ravenryd
        script: |
          set -e
          cp "${RAVENRYD_BIN}" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/ravenryd"
        inputFiles:
          - ${RAVENRYD_BIN}
        outputFiles:
          - ${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/ravenryd
