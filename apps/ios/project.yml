# XcodeGen spec for the iPhone app (scripts/build.sh generates the Xcode
# project from it; the .xcodeproj is not committed, as apps/macos does).
name: Ravenry
options:
  bundleIdPrefix: dev.ravenry
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  Ravenry:
    type: application
    platform: iOS
    sources:
      - path: Sources/Ravenry
        excludes:
          - Info.plist
          - Ravenry.entitlements
      # The alerts' key and how an alert is drawn, shared with the Notification
      # Service Extension (RavenryNotify below).
      - path: Sources/Shared
      # The Mac app's shaders, as they are: the launch's Ink (InkLaunch.swift).
      - path: ../macos/Sources/RavenryMac/Shaders.swift
      # The phone board's own screens and the app's layer over the board
      # (apps/phone, built by scripts/build.sh into build/phone).
      - path: build/phone
        type: folder
        buildPhase: resources
      # The words and the colours every client shares (Design.swift).
      - path: ../../shared/strings/en.json
        buildPhase: resources
      - path: ../../shared/tokens/tokens.json
        buildPhase: resources
    dependencies:
      - sdk: Metal.framework
      - sdk: WebKit.framework
      # The alerts through APNs, opened on the device (docs/PHONE.md section 4, "apns").
      - target: RavenryNotify
    settings:
      configs:
        # aps-environment (Sources/Ravenry/Ravenry.entitlements): a debug
        # build talks to the sandbox APNs, the App Store and TestFlight to
        # production (Push.swift tells the Mac which).
        Debug:
          RAVENRY_APS_ENVIRONMENT: development
        Release:
          RAVENRY_APS_ENVIRONMENT: production
      base:
        PRODUCT_NAME: Ravenry
        PRODUCT_BUNDLE_IDENTIFIER: dev.ravenry.ios
        INFOPLIST_FILE: Sources/Ravenry/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Ravenry/Ravenry.entitlements
        # The relay that holds the APNs key for this build (relay/README.md):
        # scripts/archive.sh sets it from outside the repository; empty here.
        RAVENRY_RELAY: ""
        # The iPhone and the iPad (full screen there, Split View and Slide Over: every iPad orientation in Info.plist).
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Mac app's version (apps/desktop/package.json) and Android's
        # versionCode scheme (major * 1000000 + minor * 1000 + patch);
        # scripts/archive.sh sets both from package.json for the App Store.
        MARKETING_VERSION: "0.1.70"
        CURRENT_PROJECT_VERSION: "1070"
        # Sources/Ravenry/Assets.xcassets/AppIcon.appiconset: the brand's
        # 1024 tile (hub/brand/ravenry/icon-1024.png), copied as it is.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The simulator only, signed ad hoc: no Apple account, no team.
        # scripts/archive.sh signs for the App Store in their place.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
  # The Notification Service Extension: opens each alert through APNs with
  # this device's key and draws it (Sources/Notify).
  RavenryNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Notify
        excludes:
          - Info.plist
          - Notify.entitlements
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: RavenryNotify
        PRODUCT_BUNDLE_IDENTIFIER: dev.ravenry.ios.notify
        INFOPLIST_FILE: Sources/Notify/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Notify/Notify.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.70"
        CURRENT_PROJECT_VERSION: "1070"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
  RavenryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RavenryTests
        excludes:
          - Fixtures
      - path: Tests/RavenryTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Ravenry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ravenry.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
  # The app driven as a person would, against a test hub (tools/ios-e2e.mjs).
  RavenryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/RavenryUITests
    dependencies:
      - target: Ravenry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ravenry.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
schemes:
  Ravenry:
    build:
      targets:
        Ravenry: all
        RavenryTests: [test]
    test:
      targets:
        - RavenryTests
  RavenryE2E:
    build:
      targets:
        Ravenry: all
        RavenryUITests: [test]
    test:
      targets:
        - RavenryUITests
