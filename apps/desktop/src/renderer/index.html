<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http://127.0.0.1:* http://localhost:*; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>Ravenry</title>
<link rel="stylesheet" href="renderer.css">
</head>
<body>
<div class="closesheet" id="closesheet" hidden></div>
<div class="mc" id="app">
  <aside class="side" id="side"></aside>
  <main class="tsheet" id="centre">
    <div class="tabs" id="tabs" role="tablist" hidden></div>
    <div id="lstrip" hidden></div>
    <div id="showing" hidden></div>
    <div id="movebar" class="mvbar" role="status" hidden></div>
    <div class="stage" id="stage">
      <div class="split" id="split" hidden>
        <div class="pbox" id="pbox0"><div class="phead" id="phead0" hidden></div><div class="term-stack" id="stack0"><div class="term-host" id="term"></div></div></div>
        <div class="pbox" id="pbox1" hidden><div class="phead" id="phead1"></div><div class="term-stack" id="stack1"><div class="term-host" id="term2"></div></div></div>
        <div class="dropzone" id="dropzone" hidden></div>
        <div class="findbar" id="findbar" role="search" hidden></div>
      </div>
      <div class="elsewhere" id="elsewhere" hidden></div>
      <div class="start" id="start" hidden></div>
      <div class="none" id="none" hidden></div>
      <div class="rv" id="review" hidden></div>
      <div class="bdoc" id="brief" hidden></div>
    </div>
    <div id="fsheet" hidden></div>
  </main>
  <main class="pg" id="page" hidden></main>
  <main class="pg" id="machines" hidden></main>
  <main class="pg" id="decisions" hidden></main>
  <main class="pg" id="picker" hidden></main>
  <main class="pg" id="grid" hidden></main>
  <main class="pg" id="learn" hidden></main>
  <main class="pg" id="inapp" hidden></main>
  <aside class="panel" id="panel" hidden></aside>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="hint" id="hint" role="note" hidden></div>
<script src="renderer.js"></script>
</body>
</html>
